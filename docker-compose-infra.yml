services:
  rabbit:
    image: rabbitmq:4-management
    container_name: rabbitmq-infra
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:alpine
    container_name: redis-infra
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: keycloak-infra
    ports:
      - "7080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./eazybank-realm.json:/opt/keycloak/data/import/eazybank-realm.json:ro
    command: "start-dev --import-realm"
